[pytest]
testpaths = tests
# `-m "not slow"` keeps the default run bounded: `slow` marks work measured in
# minutes rather than seconds, and a check that has quietly outgrown its own
# timeout reports a failure about something else. Run those deliberately with
# `pytest -m slow`. Nothing is skipped silently - the marker is registered in
# tests/conftest.py and says what it means.
#
# `-m "not render"` keeps the default batch alive: the render-marked tests map
# a real ChronoaApplication, and several in one process crash in GTK/Pango's
# symbolic-paintable snapshot, aborting the batch. Their coverage is NOT
# dropped - run them per process with `tools/run_render_tests.sh`, which
# prints how many it ran. tests/test_render_coverage_is_not_silently_skipped.py
# fails if the marker, the exclusion or that runner goes missing.
addopts = -p no:cacheprovider -m "not slow and not render"