[pytest]
testpaths = tests
# `-m "not slow"` keeps the default run bounded: `slow` marks work measured in
# minutes rather than seconds, and a check that has quietly outgrown its own
# timeout reports a failure about something else. Run those deliberately with
# `pytest -m slow`. Nothing is skipped silently - the marker is registered in
# tests/conftest.py and says what it means.
addopts = -p no:cacheprovider -m "not slow"