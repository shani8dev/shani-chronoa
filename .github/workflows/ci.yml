name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: shani8dev/shani-ci-commons/.github/workflows/lint.yml@main
    with:
      language: python

  test:
    name: Test
    uses: shani8dev/shani-ci-commons/.github/workflows/test.yml@main
    with:
      language: python
      # shani-chronoa's conftest.py inserts usr/lib/shani-chronoa into
      # sys.path itself and needs the host's gi/GTK reachable, so the
      # shared template's dependency-install step must NOT shadow it:
      # it installs pytest + httpx only, which is exactly what this
      # repo's own conftest documents as its required dep set.
      test-command: |
        xvfb-run -a env PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/ -v -p no:cacheprovider
      python-version: "3.12"
      # xvfb is not optional. tests/test_window_ux.py builds real Gtk widgets
      # (ChronoaOrbWidget is a Gtk.Button), and GTK4 with no display does not
      # raise a clean error on construction - it segfaults. That is what ended
      # this job: "Fatal Python error: Segmentation fault" at gui.py:128 in
      # ChronoaOrbWidget.__init__, called from
      # test_orb_reports_its_own_state_independently, exit 139, and because the
      # process died there pytest never printed a report for the 16 real test
      # failures that came first. The suite passed on dev machines only
      # because they have a DISPLAY. shani-cassini already runs the same way.
      #
      # gir1.2-adw-1 is needed for the same reason and for a different one:
      # settings_window.py requires the Adw namespace, so without the typelib
      # pytest cannot even COLLECT tests/test_settings_surface.py and the whole
      # run dies at collection with exit 2 - 639 items found, then interrupted.
      apt-packages: python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libglib2.0-bin xvfb
      system-site-packages: true
    needs: lint

  security:
    name: Security
    uses: shani8dev/shani-ci-commons/.github/workflows/security.yml@main
    with:
      scan-type: secrets
    needs: lint