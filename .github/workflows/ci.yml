name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: shani8dev/shani-ci-commons/.github/workflows/lint.yml@main
    with:
      language: python

  test:
    name: Test
    uses: shani8dev/shani-ci-commons/.github/workflows/test.yml@main
    with:
      language: python
      # shani-chronoa's conftest.py inserts usr/lib/shani-chronoa into
      # sys.path itself and needs the host's gi/GTK reachable, so the
      # shared template's dependency-install step must NOT shadow it:
      # it installs pytest + httpx only, which is exactly what this
      # repo's own conftest documents as its required dep set.
      test-command: |
        xvfb-run -a env PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/ -v -p no:cacheprovider
      # The runner's own stack, not ubuntu-latest's: the app needs libadwaita
      # newer than 24.04's 1.5, and on 24.04 the GUI tests segfaulted the run.
      # 26.04 matches the development machine (Python 3.14, GTK/Adw from the
      # distro, which system-site-packages tests against).
      runs-on: ubuntu-26.04
      python-version: "3.14"
      # xvfb is not optional. tests/test_window_ux.py builds real Gtk widgets
      # (ChronoaOrbWidget is a Gtk.Button), and GTK4 with no display does not
      # raise a clean error on construction - it segfaults. That is what ended
      # this job: "Fatal Python error: Segmentation fault" at gui.py:128 in
      # ChronoaOrbWidget.__init__, called from
      # test_orb_reports_its_own_state_independently, exit 139, and because the
      # process died there pytest never printed a report for the 16 real test
      # failures that came first. The suite passed on dev machines only
      # because they have a DISPLAY. shani-cassini already runs the same way.
      #
      # gir1.2-adw-1 is needed for the same reason and for a different one:
      # settings_window.py requires the Adw namespace, so without the typelib
      # pytest cannot even COLLECT tests/test_settings_surface.py and the whole
      # run dies at collection with exit 2 - 639 items found, then interrupted.
      #
      # xdotool is not decoration either. TestInputControlBackendDetection
      # deliberately tests REAL detection on the host rather than a mock, and
      # with xvfb alone the runner has an X11 display but no input backend, so
      # _detect_backend() returns None and that test fails. Installing the
      # binary keeps the test honest instead of deleting its subject.
      # x11-apps and imagemagick are for test_vision_sense's TestTheRealPath,
      # which takes a REAL screenshot with no stubs. Its skipif only asks whether
      # there is a display, so once xvfb supplied one the test started running
      # and then failed on "no X11 screen capture tool is installed (looked for
      # import, xwd)". Installing the tools keeps that test real; widening the
      # skipif to also cover a missing capture tool would delete exactly the
      # thing it exists to check.
            # gir1.2-secret-1 and wireplumber are the two the tests above need and
      # the runner did not have. secret_store.py has nothing to ask with
      # without the libsecret typelib, so the keyring row read "not
      # installed" where the test expects the bus to be consulted; and
      # without wpctl every microphone path answers "wpctl is not
      # installed on this machine" - which is the honest answer and not
      # the state the tests are about. Both packages exist on Arch
      # (libsecret, wireplumber) because the product has them there.
      #
      # bluez is here for the same reason, and its name is the one trap worth
      # writing down: on Arch the client is a separate package (bluez-utils),
      # so `apt install bluez-utils` is the natural thing to type and it does
      # not exist on Ubuntu at any release - the apt step dies with exit 100
      # and the whole Test job reports zero failures because it never ran a
      # test. Checked against the package's own filelist for resolute
      # (26.04), where bluez ships /usr/bin/bluetoothctl, gatttool, rfcomm,
      # obexctl and bluetoothd together. skills/bluetooth_gatt.py:_run gates
      # on shutil.which("bluetoothctl"), so without this package six tests in
      # test_bluetooth_listen_skill.py fail on the absence of the binary
      # rather than on anything they are testing.
      apt-packages: python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libglib2.0-bin xvfb gir1.2-secret-1 wireplumber xdotool x11-apps imagemagick bluez
      # Nine tests read shani-pkgbuilds/shani-chronoa/PKGBUILD next door: the
      # package's install list, its units, its icon, its optdepends and the
      # bytecode rule are all asserted against the real file, because the
      # package is what ships this tree. A runner has only this repo, so
      # those tests raised FileNotFoundError on a path that is not a bug in
      # either repo - they are the packaging contract, and the packaging
      # lives in shani-pkgbuilds. Checked out beside it here rather than
      # skipped, because a skipped install-list assertion is exactly the
      # thing that lets a binary go missing from a package unnoticed.
      extra-repositories: '[{"repo": "shani8dev/shani-pkgbuilds", "path": "../shani-pkgbuilds"}]'
      system-site-packages: true
    needs: lint

  security:
    name: Security
    uses: shani8dev/shani-ci-commons/.github/workflows/security.yml@main
    with:
      scan-type: secrets
    needs: lint